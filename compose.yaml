name: niodownloader

services:
  server:
    image: "${NIODOWNLOADER_IMAGE:-niodownloader/nio-server:latest}"
    init: true
    read_only: true
    user: "${NIODOWNLOADER_UID:-1000}:${NIODOWNLOADER_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 2m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      NIODOWNLOADER_DATA_DIR: /data
      NIODOWNLOADER_TEMP_DIR: /data/tmp
      NIODOWNLOADER_PLUGIN_DIR: /data/plugins
      NIODOWNLOADER_DEFAULT_SAVE_DIR: /downloads
      NIODOWNLOADER_ALLOWED_SAVE_DIRS: /downloads
      NIODOWNLOADER_ARIA2_RPC_LISTEN_ALL: "${NIODOWNLOADER_ARIA2_RPC_LISTEN_ALL:-false}"
      NIODOWNLOADER_TORRENT_BODY_LIMIT_MIB: "${NIODOWNLOADER_TORRENT_BODY_LIMIT_MIB:-8}"
      NIODOWNLOADER_MDXP_HOST: 0.0.0.0
      NIODOWNLOADER_MDXP_PORT: 16801
      NIODOWNLOADER_PUBLIC_URL: "${NIODOWNLOADER_PUBLIC_URL:-}"
      NIODOWNLOADER_REMOTE_EXTENSION_ENABLED: "${NIODOWNLOADER_REMOTE_EXTENSION_ENABLED:-false}"
      NIODOWNLOADER_REMOTE_EXTENSION_PUBLIC_URL: "${NIODOWNLOADER_REMOTE_EXTENSION_PUBLIC_URL:-}"
      NIODOWNLOADER_ALLOW_INSECURE_OPERATOR_HTTP: "${NIODOWNLOADER_ALLOW_INSECURE_OPERATOR_HTTP:-false}"
    ports:
      - "${NIODOWNLOADER_WEB_BIND_IP:-${NIODOWNLOADER_BIND_IP:-0.0.0.0}}:${NIODOWNLOADER_HTTP_PORT:-8080}:8080"
      - "${NIODOWNLOADER_MDXP_BIND_IP:-${NIODOWNLOADER_BIND_IP:-0.0.0.0}}:${NIODOWNLOADER_MDXP_PUBLIC_PORT:-16801}:16801"
    volumes:
      - ./nio-data:/data
      - ./downloads:/downloads
